<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#22bde8" />
    <link rel="preload" as="image" href="assets/ui/start-background.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="assets/ui/start-logo.webp" fetchpriority="high" />
    <title>Shape &amp; Motion Sorter — Grade 1 Maths</title>
    <link rel="stylesheet" href="styles/main.css?v=20260924-shared-certificate-1" />
  </head>
  <body>
    <main class="game-shell" aria-label="Brain Match game">
      <aside class="rotate-notice" aria-label="Landscape orientation required">
        <span class="rotate-notice__phone" aria-hidden="true"></span>
        <strong>Turn your device sideways</strong>
        <small>This game is made for landscape play.</small>
      </aside>
      <section id="game-stage" class="game-stage" aria-live="polite">
        <section id="loading-screen" class="loading-screen" aria-label="Loading game" aria-live="polite">
          <img class="loading-screen__background" src="assets/ui/start-background.webp" alt="" fetchpriority="high" />
          <div class="loading-screen__shade" aria-hidden="true"></div>
          <div class="loading-screen__content">
            <img class="loading-screen__badge" src="assets/ui/start-logo.webp" alt="" fetchpriority="high" />
            <p class="loading-screen__title">Loading…</p>
            <div class="loading-screen__track" role="progressbar" aria-label="Game loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <span data-loading-fill></span>
            </div>
            <div class="loading-screen__meta">
              <small data-loading-status>Preparing your game…</small>
              <strong data-loading-percent>0%</strong>
            </div>
          </div>
        </section>
        <section id="start-screen" class="start-screen" aria-label="Shape and Motion Sorter start screen">
          <img class="start-screen__background" src="assets/ui/start-background.webp" alt="" />
          <img class="start-screen__logo" src="assets/ui/start-logo.webp" alt="Let's Sort! Long or Round" />
          <img class="start-screen__character" src="assets/ui/start-character.webp" alt="Sparky welcoming you to the Shape Lab" />
          <button id="start-button" class="start-screen__play" type="button" aria-label="Play Shape and Motion Sorter">
            <img src="assets/ui/start-play-button.webp" alt="Play" />
          </button>
        </section>
        <div id="scene" class="scene scene--placeholder" aria-label="Game scene">
          <img class="factory-background" data-src="assets/backgrounds/shape-lab-factory.webp" alt="" />
          <div id="sparky" class="sparky" aria-hidden="true"><div class="sparky__viewport"></div></div>
          <div class="conveyor" aria-hidden="true">
            <div class="conveyor__rail conveyor__rail--top"></div>
            <div class="conveyor__track">
              <div class="conveyor__track-motion"></div>
              <svg id="conveyor-seams" class="conveyor__seams" aria-hidden="true"></svg>
            </div>
            <div class="conveyor__rail conveyor__rail--bottom"></div>
            <div class="conveyor__front-beam">
              <span></span><span></span><span></span><span></span><span></span>
              <span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="conveyor__underbody"></div>
          </div>
          <div id="belt-item-layer" aria-live="polite"></div>
          <div class="factory-floor" aria-hidden="true"></div>
          <div id="sorting-bins" class="sorting-bins" aria-label="Sorting containers"></div>
        </div>

        <header class="hud" aria-label="Game status and controls">
          <div class="hud__level">
            <img data-src="assets/ui/ui-level-panel.webp" alt="" />
            <span id="level-icon">Level 1 / 9</span><small id="level-title">Long or Round</small>
          </div>
          <div class="progress-card" aria-label="Mastery progress">
            <img id="progress-art" class="progress-card__art" data-src="assets/ui/ui-progress-bar.webp" alt="" />
            <div class="progress-card__track" role="progressbar" aria-label="Level mastery" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="mastery-fill"></span></div>
            <span id="mastery-text">0 / 15</span>
          </div>
          <div id="score-card" class="hud__score" aria-label="Level XP"><img data-src="assets/ui/ui-score-badge.webp" alt="" /><span id="score-text">0 XP</span><small id="star-target" class="hud__star-target" aria-live="polite">2★</small></div>
          <button id="sound-button" class="icon-button icon-button--sound" type="button" aria-label="Toggle sound"><img data-src="assets/ui/ui-music-button.webp" alt="" /></button>
          <button id="back-button" class="icon-button icon-button--pause" type="button" aria-label="Pause game"><span aria-hidden="true"></span></button>
        </header>

        <section id="game-ui" class="game-ui" aria-label="Game interaction area"></section>
        <section id="tutorial-layer" class="tutorial-layer" aria-live="polite" hidden></section>
      </section>
    </main>

    <script type="module" src="src/main.js?v=20260924-integer-xp-1"></script>
  </body>
</html>
